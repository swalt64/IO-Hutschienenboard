<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HS-IO">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>HS-IO</title>
    <style>
        * { box-sizing: border-box; }
        html { height: 100%; background: #0f172a; }
        body {
            height: 100vh; height: 100dvh; margin: 0; overflow: hidden;
            padding: calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            background: #0f172a; color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .app { height: 100%; display: flex; flex-direction: column; min-width: 0; }
        header {
            flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr;
            grid-template-areas: "brand status" "version version" "nav nav";
            align-items: center; gap: 6px 12px; padding: 3px 4px 7px;
        }
        h1 {
            grid-area: brand;
            margin: 0; color: #fff; font-size: 1.05rem; font-weight: 700;
            font-family: Georgia, "Times New Roman", serif; font-style: italic;
            text-shadow: 2px 2px 4px #020617;
        }
        .status {
            grid-area: status; justify-self: start; min-width: 0; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis;
            font-size: 0.78rem; color: #ef4444; white-space: nowrap;
        }
        .status.connected { color: #22c55e; }
        .nav {
            grid-area: nav; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px; align-items: center;
        }
        .nav a, .nav .lock-btn {
            min-height: 30px; display: inline-flex; align-items: center; justify-content: center;
            padding: 0 9px; border: 1px solid #334155; border-radius: 6px;
            color: #bfdbfe; background: #1e293b; font-size: 0.74rem; text-decoration: none;
            white-space: nowrap;
        }
        .nav .lock-btn {
            width: 100%; cursor: pointer; touch-action: manipulation;
            font: inherit; font-size: 0.74rem;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .nav .lock-btn.unlocked {
            border-color: #16a34a; color: #86efac; background: #14532d;
        }
        .nav .lock-btn.holding {
            border-color: #f59e0b; color: #fde68a; background: #451a03;
        }
        .rows {
            flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
            display: flex; flex-direction: column; gap: 5px; padding-right: 1px;
        }
        .row {
            flex: 0 0 auto; min-height: 70px; display: grid;
            grid-template-columns: 26px minmax(0, 1fr) 88px;
            align-items: center; column-gap: 10px; row-gap: 5px; padding: 5px 8px;
            background: #1e293b; border: 1px solid #334155; border-radius: 6px;
        }
        .led {
            width: 20px; height: 20px; border-radius: 50%;
            background: #374151; border: 2px solid #6b7280;
        }
        .led.on {
            background: #22c55e; border-color: #bbf7d0;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
        }
        .text {
            grid-column: 2; min-width: 0; width: 100%; max-width: 100%;
            overflow: hidden; align-self: center; position: relative; z-index: 0;
            contain: paint;
        }
        .name {
            position: relative; color: #fff; font-size: 0.96rem; line-height: 1.2;
            white-space: nowrap; overflow: hidden; max-width: 100%;
            contain: paint; clip-path: inset(0);
        }
        .name .marquee {
            display: inline-block; max-width: none; will-change: transform;
        }
        .name.scroll .marquee {
            padding-right: 24px;
            animation: marquee-pingpong var(--scroll-duration, 7s) ease-in-out infinite alternate;
        }
        @keyframes marquee-pingpong {
            from { transform: translateX(0); }
            to { transform: translateX(calc(-1 * var(--scroll-distance, 0px))); }
        }
        .rest {
            min-height: 1.05em; margin-top: 2px; color: #93c5fd;
            font-size: 0.76rem; line-height: 1.05; font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        button.out-btn {
            grid-column: 3; justify-self: end; width: 88px; min-width: 88px; height: 54px; min-height: 54px;
            border: 0; border-radius: 9px;
            padding: 0 4px; background: #0ea5e9; color: #fff;
            font: inherit; font-size: 0.84rem; font-weight: 700;
            box-shadow: inset 0 1px rgba(255,255,255,0.35), 0 2px 0 rgba(0,0,0,0.35);
            touch-action: manipulation; position: relative; z-index: 2;
        }
        button.out-btn.taster { background: #dc2626; }
        button.out-btn:active { transform: scale(0.94); filter: brightness(0.82); }
        body.offline button.out-btn,
        body.locked  button.out-btn { opacity: 0.45; pointer-events: none; }
        .versions {
            grid-area: version; display: none; justify-self: start;
            color: #64748b; font-size: 0.63rem; line-height: 1; white-space: nowrap;
        }
        @media (orientation: landscape) {
            header { grid-template-columns: auto 1fr auto; grid-template-areas: "brand nav status" "brand nav version"; }
            .nav { justify-self: center; width: min(560px, 100%); }
            .rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
            .row { min-height: 58px; grid-template-columns: 22px minmax(0, 1fr) 78px; }
            button.out-btn { width: 78px; min-width: 78px; height: 44px; min-height: 44px; font-size: 0.78rem; }
            .name { font-size: 0.82rem; }
            .rest { font-size: 0.68rem; }
        }
        @media (max-width: 420px) {
            header { gap: 6px 10px; }
            .versions { justify-self: start; }
            .nav a, .nav .lock-btn { padding: 0 5px; font-size: 0.68rem; }
            .row { grid-template-columns: 26px minmax(0, 1fr) 82px; min-height: 66px; column-gap: 10px; row-gap: 5px; }
            button.out-btn { width: 82px; min-width: 82px; height: 50px; min-height: 50px; font-size: 0.82rem; }
        }
        @media (max-width: 320px) {
            .nav { grid-template-columns: 1fr 1fr; }
            .nav a, .nav .lock-btn { justify-content: center; width: 100%; }
        }
    </style>
</head>
<body class="offline locked">
<div class="app">
    <header>
        <h1>HS-IO</h1>
        <nav class="nav" aria-label="Navigation">
            <a href="/status.html">Status</a>
            <a href="/mapping.html">Zuordnung</a>
            <a href="/config.html">Konfig</a>
            <button class="lock-btn" id="lock-btn" type="button">🔒 Sperre</button>
        </nav>
        <div id="connection-status" class="status">Verbinde...</div>
        <div id="version-line" class="versions"></div>
    </header>
    <main class="rows" id="rows"></main>
</div>

<script>
const NUM_CH = 12;
const WEB_UI_VERSION = '2.13';
let ws;
let pressed = null;
let state = {
    outputs: Array(NUM_CH).fill(false),
    remaining: Array(NUM_CH).fill(0),
    names: Array(NUM_CH).fill('').map((_, i) => 'Ausgang ' + (i + 1)),
    out_modes: Array(NUM_CH).fill(0),
    out_order: Array(NUM_CH).fill(0).map((_, i) => i),
    out_enabled: Array(NUM_CH).fill(true),
    rssi: null
};

// ---- Tastensperre -------------------------------------------------------
const LOCK_HOLD_MS    = 1000;          // Haltezeit zum Entsperren
const LOCK_TIMEOUT_MS = 5 * 60 * 1000; // 5 Minuten Auto-Sperre

let keyLock                  = true;
let keyLockExpiry            = 0;
let lockHoldTimer            = null;
let lockDownWhileUnlocked    = false; // true wenn pointerdown auf entsperrten Button
let connCheckCounter         = 0;

function updateLockBtn() {
    const btn = document.getElementById('lock-btn');
    if (!btn) return;
    document.body.classList.toggle('locked', keyLock);
    if (keyLock) {
        btn.textContent = '🔒 Sperre';
        btn.classList.remove('unlocked', 'holding');
    } else {
        const secsLeft = Math.max(0, Math.round((keyLockExpiry - Date.now()) / 1000));
        const m = Math.floor(secsLeft / 60);
        const s = secsLeft % 60;
        btn.textContent = `🔓 ${pad(m)}:${pad(s)}`;
        btn.classList.add('unlocked');
        btn.classList.remove('holding');
    }
}

function bindLockButton() {
    const btn = document.getElementById('lock-btn');
    if (!btn) return;

    const down = e => {
        e.preventDefault();
        if (!keyLock) {
            // Bereits entsperrt: beim Loslassen sperren
            lockDownWhileUnlocked = true;
            return;
        }
        lockDownWhileUnlocked = false;
        btn.classList.add('holding');
        lockHoldTimer = setTimeout(() => {
            lockHoldTimer = null;
            keyLock = false;
            keyLockExpiry = Date.now() + LOCK_TIMEOUT_MS;
            playClick(true);
            updateLockBtn();
            // Finger noch gedrückt – beim Loslassen NICHT sperren
            lockDownWhileUnlocked = false;
        }, LOCK_HOLD_MS);
    };

    const up = e => {
        if (e) e.preventDefault();
        if (lockDownWhileUnlocked) {
            lockDownWhileUnlocked = false;
            keyLock = true;
            keyLockExpiry = 0;
            playClick(false);
            updateLockBtn();
            return;
        }
        if (lockHoldTimer) {
            clearTimeout(lockHoldTimer);
            lockHoldTimer = null;
            btn.classList.remove('holding');
        }
    };

    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup',   up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
}
// -------------------------------------------------------------------------

function pad(v) { return String(v).padStart(2, '0'); }

function secsToHMS(secs) {
    secs = Math.max(0, Number(secs) || 0);
    if (secs <= 0) return '';
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

let audioCtx = null;
function playClick(on) {
    if (window.HSIOAndroid && typeof window.HSIOAndroid.click === 'function') {
        window.HSIOAndroid.click(!!on);
        return;
    }
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(on ? 1900 : 850, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
    } catch(e) { }
}

function uniqueName(ch, name) {
    if (!name || name === `Ausgang ${ch + 1}`) return false;
    for (let i = 0; i < NUM_CH; i++) {
        if (i !== ch && state.out_enabled[i] && (state.names[i] || '').trim() === name) return false;
    }
    return true;
}

function labelFor(ch) {
    const name = (state.names[ch] || '').trim() || `Ausgang ${ch + 1}`;
    return uniqueName(ch, name) ? name : `A${ch + 1}  ${name}`;
}

function renderRows() {
    const root = document.getElementById('rows');
    root.innerHTML = '';
    let visible = 0;
    for (let pos = 0; pos < NUM_CH; pos++) {
        const ch = state.out_order[pos];
        if (ch < 0 || ch >= NUM_CH || !state.out_enabled[ch]) continue;
        visible++;
        const row = document.createElement('section');
        row.className = 'row';
        row.dataset.ch = ch;
        row.innerHTML = `
            <div class="led" id="led-${ch}"></div>
            <div class="text">
                <div class="name" id="name-${ch}"><span class="marquee"></span></div>
                <div class="rest" id="rest-${ch}"></div>
            </div>
            <button type="button" class="out-btn" id="btn-${ch}">Toggle</button>`;
        root.appendChild(row);
        bindButton(ch);
    }
    if (visible === 0) {
        for (let ch = 0; ch < NUM_CH; ch++) state.out_order[ch] = ch;
        state.out_enabled.fill(true);
        renderRows();
        return;
    }
    updateUI();
}

function updateUI() {
    for (let ch = 0; ch < NUM_CH; ch++) {
        const led  = document.getElementById(`led-${ch}`);
        const name = document.getElementById(`name-${ch}`);
        const rest = document.getElementById(`rest-${ch}`);
        const btn  = document.getElementById(`btn-${ch}`);
        if (led) led.className = state.outputs[ch] ? 'led on' : 'led';
        if (name) {
            const marquee = name.querySelector('.marquee');
            if (marquee) marquee.textContent = labelFor(ch);
        }
        if (rest) rest.textContent = state.outputs[ch] && state.remaining[ch] > 0 ? `Restzeit ${secsToHMS(state.remaining[ch])}` : '';
        if (btn) {
            const isTaster = state.out_modes[ch] === 1;
            btn.textContent = isTaster ? 'Taster' : 'Toggle';
            btn.className = 'out-btn' + (isTaster ? ' taster' : '');
        }
    }
    refreshMarquees();
}

let marqueeFrame = 0;
let marqueeTimer = 0;
function refreshMarquees(delay = 0) {
    clearTimeout(marqueeTimer);
    cancelAnimationFrame(marqueeFrame);
    const run = () => marqueeFrame = requestAnimationFrame(() => {
        document.querySelectorAll('.name').forEach(name => {
            const marquee = name.querySelector('.marquee');
            if (!marquee) return;
            name.classList.remove('scroll');
            marquee.style.transform = '';
            const nameWidth = name.getBoundingClientRect().width;
            const textWidth = marquee.getBoundingClientRect().width;
            const distance = Math.ceil(textWidth - nameWidth);
            if (nameWidth > 0 && distance > 12) {
                name.style.setProperty('--scroll-distance', `${distance}px`);
                name.style.setProperty('--scroll-duration', `${Math.max(4, Math.min(12, distance / 18 + 3)).toFixed(1)}s`);
                name.classList.add('scroll');
            }
        });
    });
    if (delay > 0) marqueeTimer = setTimeout(run, delay);
    else run();
}

function bindButton(ch) {
    const btn = document.getElementById(`btn-${ch}`);
    if (!btn) return;
    const down = e => {
        e.preventDefault();
        if (pressed !== null) return;
        if (state.out_modes[ch] === 1) {
            pressed = { ch };
            playClick(true);
            wsSend({cmd:'set', ch, val:true, armed:true});
        } else {
            playClick(!state.outputs[ch]);
            wsSend({cmd:'toggle', ch, armed:true});
        }
    };
    const up = e => {
        if (e) e.preventDefault();
        if (!pressed || pressed.ch !== ch) return;
        playClick(false);
        wsSend({cmd:'set', ch, val:false, armed:true});
        pressed = null;
    };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup',   up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('lostpointercapture', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
}

function changed(next, current) {
    return JSON.stringify(next || null) !== JSON.stringify(current || null);
}

function applyState(data) {
    const layoutChanged =
        (data.out_order   && changed(data.out_order,   state.out_order)) ||
        (data.out_enabled && changed(data.out_enabled, state.out_enabled));
    if (data.outputs)     state.outputs     = data.outputs;
    if (data.remaining)   state.remaining   = data.remaining.map(v => Math.max(0, Number(v) || 0));
    if (data.names)       state.names       = data.names;
    if (data.out_modes)   state.out_modes   = data.out_modes;
    if (data.out_order)   state.out_order   = data.out_order;
    if (data.out_enabled) state.out_enabled = data.out_enabled.map(v => v === true || v === 1 || v === '1');
    if (data.version)     updateVersionLine(data.version);
    if (data.wifi_rssi !== undefined) { state.rssi = data.wifi_rssi; updateConnStatus(); }
    if (layoutChanged && pressed === null) renderRows();
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function rssiToPct(rssi) {
    if (rssi === null || rssi === undefined) return null;
    return Math.min(100, Math.max(0, 2 * (rssi + 100)));
}

function updateConnStatus() {
    const el = document.getElementById('connection-status');
    if (!el) return;
    const online = !document.body.classList.contains('offline');
    if (!online) { el.textContent = 'Getrennt'; el.className = 'status'; return; }
    const pct = rssiToPct(state.rssi);
    el.textContent = pct !== null ? `Verbunden ${pct}%` : 'Verbunden';
    el.className = 'status connected';
}

function setConnected(ok) {
    document.body.classList.toggle('offline', !ok);
    updateConnStatus();
}

function appVersion() {
    if (window.HSIOAndroid && typeof window.HSIOAndroid.appVersion === 'function') {
        try { return window.HSIOAndroid.appVersion(); } catch(e) { }
    }
    return 'Web';
}

function updateVersionLine(fwVersion) {
    const el = document.getElementById('version-line');
    if (!el) return;
    const fw = fwVersion ? `FW ${fwVersion}` : '';
    el.textContent = [`App ${appVersion()}`, `Web ${WEB_UI_VERSION}`, fw].filter(Boolean).join('  |  ');
    el.style.display = 'block';
}

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => setConnected(true);
    ws.onclose = () => {
        setConnected(false);
        setTimeout(connectWS, 2000);
    };
    ws.onmessage = evt => {
        try {
            applyState(JSON.parse(evt.data));
            updateUI();
        } catch (e) {
            console.warn('Statusdaten ungültig', e);
        }
    };
}

function tickSecond() {
    // Countdown
    let dirty = false;
    for (let ch = 0; ch < NUM_CH; ch++) {
        if (state.outputs[ch] && state.remaining[ch] > 0) {
            state.remaining[ch] -= 1;
            dirty = true;
        }
    }
    if (dirty) updateUI();

    // Auto-Relock + Countdown-Anzeige im Lock-Button
    if (!keyLock) {
        if (Date.now() >= keyLockExpiry) {
            keyLock = true;
            keyLockExpiry = 0;
        }
        updateLockBtn();
    }

    // Verbindungs-Watchdog: alle 10 s prüfen
    if (++connCheckCounter >= 10) {
        connCheckCounter = 0;
        if (!ws || ws.readyState !== WebSocket.OPEN) setConnected(false);
    }
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
window.addEventListener('resize', () => refreshMarquees(80));
window.addEventListener('load',   () => refreshMarquees(250));

bindLockButton();
renderRows();
fetch('/api/state').then(r => r.json()).then(data => { applyState(data); renderRows(); refreshMarquees(250); }).catch(() => {});
setInterval(tickSecond, 1000);
connectWS();
</script>
</body>
</html>

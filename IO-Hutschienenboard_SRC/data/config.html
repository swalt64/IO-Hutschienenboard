<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO-Hutschienenboard – Konfiguration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
        h1 { text-align: center; margin-bottom: 16px; color: #0f3460; background: #e0e0e0; padding: 12px; border-radius: 8px; }
        .section { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .section h2 { margin-bottom: 12px; color: #0ea5e9; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 6px 4px; border-bottom: 1px solid #1e3a5f; text-align: center; }
        th { color: #94a3b8; font-size: 0.85rem; }
        td.col-nr, th.col-nr { width: 1px; white-space: nowrap; padding-right: 8px; color: #64748b; font-size: 0.8rem; }
        input[type=text].name-input { background: #1e293b; color: #eee; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; width: 100%; }
        input[type=text], input[type=password] { background: #1e293b; color: #eee; border: 1px solid #334155; border-radius: 4px; padding: 6px; width: 200px; margin: 4px; }
        button { background: #0ea5e9; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
        button:hover { background: #0284c7; }
        .status { text-align: center; padding: 8px; font-size: 0.85rem; color: #94a3b8; }
        #connection-status { text-align: center; padding: 4px; font-size: 0.8rem; }
        .connected { color: #22c55e; }
        .disconnected { color: #ef4444; }
        .nav { text-align: left; margin-bottom: 8px; }
        .nav a { color: #0ea5e9; font-size: 0.85rem; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .two-col { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <h1>Konfiguration</h1>
    <div id="connection-status" class="disconnected">Verbindung wird hergestellt...</div>
    <div class="nav"><a href="/">&#8592; Zurück zur Übersicht</a></div>

    <div class="two-col">
        <div class="section">
            <h2>Eingangs-Namen</h2>
            <table>
                <thead><tr><th class="col-nr">Nr.</th><th>Name</th></tr></thead>
                <tbody id="iname-table"></tbody>
            </table>
        </div>
        <div class="section">
            <h2>Ausgangs-Namen</h2>
            <table>
                <thead><tr><th class="col-nr">Nr.</th><th>Name</th></tr></thead>
                <tbody id="name-table"></tbody>
            </table>
        </div>
    </div>

    <div class="section">
        <h2>WiFi &amp; Zugangsdaten</h2>
        <div>
            <label>SSID: <input type="text" id="wifi-ssid"></label>
            <label>Passwort: <input type="password" id="wifi-pass" placeholder="(leer = unverändert)"></label>
        </div>
        <div style="margin-top:8px;">
            <label>Web-Benutzer: <input type="text" id="ui-user" placeholder="(leer = unverändert)" autocomplete="username"></label>
            <label>Web-Passwort: <input type="password" id="ui-pass" placeholder="(leer = unverändert)" autocomplete="new-password"></label>
        </div>
        <div style="margin-top:8px;">
            <label>OTA-Passwort: <input type="password" id="ota-pass" placeholder="(leer = unverändert)" autocomplete="new-password"></label>
            <span style="font-size:0.75rem;color:#6b7280;margin-left:4px;">→ ota_pass.txt aktualisieren</span>
        </div>
        <div style="margin-top:8px;">
            <button onclick="saveWifi()">Speichern &amp; Neustart</button>
            <button onclick="location.href='/update'" style="background:#6366f1;margin-left:8px;">Firmware Update</button>
        </div>
        <div class="status" id="wifi-info"></div>
        <div class="status" id="fw-version" style="color:#4b5563;font-size:0.75rem;"></div>
    </div>

<script>
const NUM_CH = 12;
let ws;
let state = {
    names:       Array(NUM_CH).fill('').map((_, i) => 'Ausgang ' + (i + 1)),
    input_names: Array(NUM_CH).fill('').map((_, i) => 'Eingang ' + (i + 1))
};

function initTables() {
    const itbody = document.getElementById('iname-table');
    const otbody = document.getElementById('name-table');
    for (let i = 0; i < NUM_CH; i++) {
        const itr = document.createElement('tr');
        itr.innerHTML = `
            <td class="col-nr">E${i+1}</td>
            <td class="col-name"><input type="text" class="name-input" id="iname-${i}" maxlength="60"
                       value="Eingang ${i+1}" onchange="setInputName(${i}, this.value)"></td>`;
        itbody.appendChild(itr);

        const otr = document.createElement('tr');
        otr.innerHTML = `
            <td class="col-nr">A${i+1}</td>
            <td class="col-name"><input type="text" class="name-input" id="name-${i}" maxlength="60"
                       value="Ausgang ${i+1}" onchange="setName(${i}, this.value)"></td>`;
        otbody.appendChild(otr);
    }
}

function updateUI() {
    for (let i = 0; i < NUM_CH; i++) {
        const inEl = document.getElementById(`iname-${i}`);
        if (document.activeElement !== inEl) inEl.value = state.input_names[i];
        const outEl = document.getElementById(`name-${i}`);
        if (document.activeElement !== outEl) outEl.value = state.names[i];
    }
}

function applyState(data) {
    if (data.names)       state.names       = data.names;
    if (data.input_names) state.input_names = data.input_names;
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
        document.getElementById('connection-status').textContent = 'Verbunden';
        document.getElementById('connection-status').className = 'connected';
    };
    ws.onclose = () => {
        document.getElementById('connection-status').textContent = 'Verbindung getrennt – Neuverbindung...';
        document.getElementById('connection-status').className = 'disconnected';
        setTimeout(connectWS, 2000);
    };
    ws.onmessage = (evt) => { try { applyState(JSON.parse(evt.data)); updateUI(); } catch(e) { console.warn('WS parse error', e); } };
}

function setName(ch, val) { wsSend({cmd:'name', ch, name: val.trim()}); }
function setInputName(ch, val) { wsSend({cmd:'iname', ch, name: val.trim()}); }

function saveWifi() {
    const ssid = document.getElementById('wifi-ssid').value;
    const pass = document.getElementById('wifi-pass').value;
    const uiUser = document.getElementById('ui-user').value.trim();
    const uiPass = document.getElementById('ui-pass').value;
    const otaPass = document.getElementById('ota-pass').value;
    if (!confirm(`WiFi auf '${ssid}' setzen und ESP neu starten?`)) return;
    const msg = {cmd:'wifi', ssid};
    if (pass)    msg.pass     = pass;
    if (uiUser)  msg.ui_user  = uiUser;
    if (uiPass)  msg.ui_pass  = uiPass;
    if (otaPass) msg.ota_pass = otaPass;
    wsSend(msg);
}

fetch('/api/state').then(r => r.json()).then(data => {
    applyState(data);
    updateUI();
    document.getElementById('wifi-ssid').value = data.sta_ssid || '';
    if (data.sta_pass_set)
        document.getElementById('wifi-pass').placeholder = '(gespeichert – leer lassen zum Beibehalten)';
    document.getElementById('wifi-info').textContent =
        `AP: ${data.ap_ip} | STA: ${data.sta_ip} (${data.sta_ssid || 'nicht konfiguriert'})`;
    if (data.version)
        document.getElementById('fw-version').textContent = `Firmware: v${data.version}`;
}).catch(e => console.warn('fetch /api/state failed', e));

initTables();
updateUI();
connectWS();
</script>
</body>
</html>

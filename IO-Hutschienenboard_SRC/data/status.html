<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO-Hutschienenboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
        h1 { text-align: center; margin-bottom: 16px; color: #0f3460; background: #e0e0e0; padding: 12px; border-radius: 8px; }
        .section { background: #16213e; border-radius: 8px; padding: 16px; }
        .section h2 { margin-bottom: 12px; color: #0ea5e9; font-size: 1.1rem; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 7px 5px; border-bottom: 1px solid #1e3a5f; white-space: nowrap; }
        th { color: #94a3b8; font-size: 0.8rem; text-align: center; }
        td.col-name { width: 99%; text-align: left; color: #cbd5e1; font-size: 0.9rem; white-space: normal; }
        td.col-time { text-align: right; color: #64748b; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
        td.col-rest { text-align: right; color: #93c5fd; font-size: 0.78rem; font-variant-numeric: tabular-nums; }
        td.col-nr { color: #64748b; font-size: 0.8rem; text-align: center; }
        td.col-action { text-align: right; }
        .led { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: middle; }
        .led-off      { background: #374151; border: 2px solid #6b7280; }
        .led-on       { background: #22c55e; box-shadow: 0 0 6px #22c55e; border: 2px solid #16a34a; }
        .led-input-on { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; border: 2px solid #d97706; }
        button.toggle { background: #0ea5e9; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 0.82rem; width: 92px; min-width: 92px; }
        button.toggle:hover { background: #0284c7; }
        button.toggle.taster { background: #dc2626; }
        button.toggle.taster:hover { background: #b91c1c; }
        button.toggle.taster:active { background: #991b1b; }
        button.alloff { background: #dc2626; color: #fff; border: none; border-radius: 4px; padding: 6px 16px; cursor: pointer; font-size: 0.9rem; }
        button.alloff:hover { background: #b91c1c; }
        #connection-status { text-align: center; padding: 4px; font-size: 0.8rem; margin-bottom: 8px; }
        .connected { color: #22c55e; }
        .disconnected { color: #ef4444; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .nav-links { display: flex; gap: 12px; }
        .nav a { color: #0ea5e9; font-size: 0.85rem; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        .ui-version { font-size: 0.75rem; color: #4b5563; }
        body.offline button { opacity: 0.35; pointer-events: none; cursor: not-allowed; }
    </style>
</head>
<body class="offline">
    <h1>IO-Hutschienenboard</h1>
    <div id="connection-status" class="disconnected">Verbindung wird hergestellt...</div>
    <div class="nav">
        <span class="ui-version">UI v2.10</span>
        <div class="nav-links">
            <a href="/">&#9654; Bedienung</a>
            <a href="/mapping.html">&#8660; Zuordnung</a>
            <a href="/config.html">&#9881; Konfiguration</a>
        </div>
    </div>

    <div style="text-align:center;margin-bottom:12px;">
        <button class="alloff" onclick="allOff()">&#9209; Alle Ausgänge AUS</button>
    </div>

    <div class="two-col">
        <div class="section">
            <h2>Eingänge</h2>
            <table>
                <thead><tr>
                    <th>Nr.</th><th></th><th style="text-align:left">Name</th><th>Letzte Betätigung</th>
                </tr></thead>
                <tbody id="input-table"></tbody>
            </table>
        </div>
        <div class="section">
            <h2>Ausgänge</h2>
            <table>
                <thead><tr>
                    <th>Nr.</th><th></th><th style="text-align:left">Name</th><th>Letzte Aktion</th><th>Restzeit</th><th></th>
                </tr></thead>
                <tbody id="output-table"></tbody>
            </table>
        </div>
    </div>

<script>
const NUM_CH = 12;
let ws;
let state = {
    inputs:      Array(NUM_CH).fill(false),
    outputs:     Array(NUM_CH).fill(false),
    remaining:   Array(NUM_CH).fill(0),
    names:       Array(NUM_CH).fill('').map((_, i) => 'Ausgang ' + (i + 1)),
    input_names: Array(NUM_CH).fill('').map((_, i) => 'Eingang ' + (i + 1)),
    last_input:  Array(NUM_CH).fill(0),
    last_output: Array(NUM_CH).fill(0),
    out_modes:   Array(NUM_CH).fill(0),
    out_order:   Array(NUM_CH).fill(0).map((_,i)=>i),
    out_enabled: Array(NUM_CH).fill(true)
};

function formatTime(ts) {
    if (!ts) return '–';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

function secsToHMS(secs) {
    if (!secs || secs <= 0) return '';
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

let audioCtx = null;
function playClick(on) {
    if (window.HSIOAndroid && typeof window.HSIOAndroid.click === 'function') {
        window.HSIOAndroid.click(!!on);
        return;
    }
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(on ? 1900 : 850, now);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
    } catch(e) { }
}

function initTables() {
    const itbody = document.getElementById('input-table');
    const otbody = document.getElementById('output-table');
    for (let i = 0; i < NUM_CH; i++) {
        const itr = document.createElement('tr');
        itr.innerHTML = `
            <td class="col-nr">E${i+1}</td>
            <td><span class="led led-off" id="in-led-${i}"></span></td>
            <td class="col-name" id="in-name-${i}">Eingang ${i+1}</td>
            <td class="col-time" id="in-time-${i}">–</td>`;
        itbody.appendChild(itr);

    }
}

function rebuildOutputTable() {
    const otbody = document.getElementById('output-table');
    otbody.innerHTML = '';
    for (let pos = 0; pos < NUM_CH; pos++) {
        const i = state.out_order[pos];
        if (!state.out_enabled[i]) continue;
        const otr = document.createElement('tr');
        otr.innerHTML = `
            <td class="col-nr">A${i+1}</td>
            <td><span class="led led-off" id="out-led-${i}"></span></td>
            <td class="col-name" id="out-name-${i}">${state.names[i]}</td>
            <td class="col-time" id="out-time-${i}">–</td>
            <td class="col-rest" id="out-rest-${i}"></td>
            <td class="col-action"><button class="toggle" id="out-btn-${i}">Toggle</button></td>`;
        otbody.appendChild(otr);
        bindButton(i);
    }
    updateUI();
}

function tickCountdown() {
    let changed = false;
    for (let i = 0; i < NUM_CH; i++) {
        if (state.outputs[i] && state.remaining[i] > 0) {
            state.remaining[i] -= 1;
            changed = true;
        }
    }
    if (changed) updateRemaining();
}

function updateRemaining() {
    for (let i = 0; i < NUM_CH; i++) {
        const el = document.getElementById(`out-rest-${i}`);
        if (el) el.textContent = (state.outputs[i] && state.remaining[i] > 0)
            ? secsToHMS(state.remaining[i]) : '';
    }
}

function updateUI() {
    for (let i = 0; i < NUM_CH; i++) {
        document.getElementById(`in-led-${i}`).className =
            state.inputs[i] ? 'led led-input-on' : 'led led-off';
        document.getElementById(`in-name-${i}`).textContent = state.input_names[i];
        document.getElementById(`in-time-${i}`).textContent = formatTime(state.last_input[i]);

        const outLed  = document.getElementById(`out-led-${i}`);
        const outName = document.getElementById(`out-name-${i}`);
        const outTime = document.getElementById(`out-time-${i}`);
        if (outLed)  outLed.className   = state.outputs[i] ? 'led led-on' : 'led led-off';
        if (outName) outName.textContent = state.names[i];
        if (outTime) outTime.textContent = formatTime(state.last_output[i]);
    }
    updateRemaining();
}

function bindButton(i) {
    const btn = document.getElementById(`out-btn-${i}`);
    if (!btn) return;
    const isTaster = state.out_modes[i] === 1;
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.textContent = isTaster ? 'Taster' : 'Toggle';
    newBtn.className = isTaster ? 'toggle taster' : 'toggle';
    if (isTaster) {
        let pressed = false;
        const press = (e) => {
            e.preventDefault();
            pressed = true;
            playClick(true);
            wsSend({cmd:'set', ch:i, val:true, armed:true});
        };
        const release = (e) => {
            e.preventDefault();
            if (pressed) { playClick(false); wsSend({cmd:'set', ch:i, val:false, armed:true}); }
            pressed = false;
        };
        newBtn.addEventListener('mousedown',   press);
        newBtn.addEventListener('touchstart',  press,   {passive:false});
        newBtn.addEventListener('mouseup',     release);
        newBtn.addEventListener('mouseleave',  release);
        newBtn.addEventListener('touchend',    release, {passive:false});
        newBtn.addEventListener('touchcancel', release, {passive:false});
    } else {
        const LONG_MS = 2000;
        let pressTimer = null;
        const onDown = (e) => {
            if (e.type === 'touchstart') e.preventDefault();
            newBtn.style.transition = `background-color ${LONG_MS}ms linear`;
            newBtn.style.backgroundColor = '#dc2626';
            pressTimer = setTimeout(() => {
                pressTimer = null;
                newBtn.style.transition = '';
                newBtn.style.backgroundColor = '';
                playClick(false);
                wsSend({cmd:'alloff'});
            }, LONG_MS);
        };
        const onUp = (e) => {
            if (e.type === 'touchend') e.preventDefault();
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                newBtn.style.transition = '';
                newBtn.style.backgroundColor = '';
                playClick(!state.outputs[i]);
                wsSend({cmd:'toggle', ch:i, armed:true});
            }
        };
        const onCancel = () => {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
                newBtn.style.transition = '';
                newBtn.style.backgroundColor = '';
            }
        };
        newBtn.addEventListener('mousedown',   onDown);
        newBtn.addEventListener('touchstart',  onDown,   {passive:false});
        newBtn.addEventListener('mouseup',     onUp);
        newBtn.addEventListener('touchend',    onUp,     {passive:false});
        newBtn.addEventListener('mouseleave',  onCancel);
        newBtn.addEventListener('touchcancel', onCancel);
    }
}

function applyState(data) {
    const modesChanged   = data.out_modes   && JSON.stringify(data.out_modes)   !== JSON.stringify(state.out_modes);
    const orderChanged   = data.out_order   && JSON.stringify(data.out_order)   !== JSON.stringify(state.out_order);
    const enabledChanged = data.out_enabled && JSON.stringify(data.out_enabled) !== JSON.stringify(state.out_enabled);
    if (data.inputs)      state.inputs      = data.inputs;
    if (data.outputs)     state.outputs     = data.outputs;
    if (data.remaining)   state.remaining   = data.remaining;
    if (data.names)       state.names       = data.names;
    if (data.input_names) state.input_names = data.input_names;
    if (data.last_input)  state.last_input  = data.last_input;
    if (data.last_output) state.last_output = data.last_output;
    if (data.out_modes)   state.out_modes   = data.out_modes;
    if (data.out_order)   state.out_order   = data.out_order;
    if (data.out_enabled) state.out_enabled = data.out_enabled;
    if (orderChanged || enabledChanged) rebuildOutputTable();
    else if (modesChanged) for (let i = 0; i < NUM_CH; i++) bindButton(i);
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
        document.getElementById('connection-status').textContent = 'Verbunden';
        document.getElementById('connection-status').className = 'connected';
        document.body.classList.remove('offline');
    };
    ws.onclose = () => {
        document.getElementById('connection-status').textContent = 'Verbindung getrennt – Neuverbindung...';
        document.getElementById('connection-status').className = 'disconnected';
        document.body.classList.add('offline');
        setTimeout(connectWS, 2000);
    };
    ws.onmessage = (evt) => {
        try { applyState(JSON.parse(evt.data)); updateUI(); } catch(e) { console.warn('WS parse error', e); }
    };
}

function toggleRelay(ch) { wsSend({cmd:'toggle', ch}); }
function allOff() { playClick(false); wsSend({cmd:'alloff'}); }

fetch('/api/state').then(r => r.json()).then(data => { applyState(data); updateUI(); })
    .catch(e => console.warn('fetch /api/state failed', e));

initTables();
rebuildOutputTable();
updateUI();
setInterval(tickCountdown, 1000);
connectWS();
</script>
</body>
</html>

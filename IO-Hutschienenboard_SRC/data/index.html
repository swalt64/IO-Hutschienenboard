<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO-Hutschienenboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
        h1 { text-align: center; margin-bottom: 16px; color: #0f3460; background: #e0e0e0; padding: 12px; border-radius: 8px; }
        .section { background: #16213e; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .section h2 { margin-bottom: 12px; color: #0ea5e9; font-size: 1.1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #1e3a5f; white-space: nowrap; }
        th { color: #94a3b8; font-size: 0.85rem; }
        td.col-iname { text-align: left; color: #cbd5e1; font-size: 0.9rem; }
        td.col-map { width: 99%; }
        td.col-timer { }
        .led { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; }
        .led-off      { background: #374151; border: 2px solid #6b7280; }
        .led-on       { background: #22c55e; box-shadow: 0 0 6px #22c55e; border: 2px solid #16a34a; }
        .led-input-on { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; border: 2px solid #d97706; }
        select { background: #1e293b; color: #eee; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; width: 100%; }
        input[type=text].timer-input { background: #1e293b; color: #eee; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; width: 80px; font-family: monospace; text-align: center; }
        button { background: #0ea5e9; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
        button:hover { background: #0284c7; }
        .remaining { margin-top: 4px; font-size: 0.75rem; color: #93c5fd; min-height: 1em; }
        #connection-status { text-align: center; padding: 4px; font-size: 0.8rem; }
        .connected { color: #22c55e; }
        .disconnected { color: #ef4444; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .nav a { color: #0ea5e9; font-size: 0.85rem; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        .ui-version { font-size: 0.75rem; color: #4b5563; }
    </style>
</head>
<body>
    <h1>IO-Hutschienenboard</h1>
    <div id="connection-status" class="disconnected">Verbindung wird hergestellt...</div>
    <div class="nav">
        <span class="ui-version">UI v1.2</span>
        <a href="/config.html">&#9881; Konfiguration</a>
    </div>

    <div class="section">
        <h2>Kanal-Zuordnung &amp; Status</h2>
        <table>
            <thead>
                <tr>
                    <th class="col-nr">Nr.</th>
                    <th class="col-iname">Eingang</th>
                    <th class="col-st">Status</th>
                    <th class="col-map">&#8594; Ausgang</th>
                    <th class="col-rel">Relais</th>
                    <th class="col-timer">Auto-Aus</th>
                    <th class="col-btn">Manuell</th>
                </tr>
            </thead>
            <tbody id="channel-table"></tbody>
        </table>
    </div>

<script>
const NUM_CH = 12;
let ws;
let state = {
    inputs:      Array(NUM_CH).fill(false),
    outputs:     Array(NUM_CH).fill(false),
    mappings:    Array(NUM_CH).fill(-1),
    timers:      Array(NUM_CH).fill(0),
    remaining:   Array(NUM_CH).fill(0),
    names:       Array(NUM_CH).fill('').map((_, i) => 'Ausgang ' + (i + 1)),
    input_names: Array(NUM_CH).fill('').map((_, i) => 'Eingang ' + (i + 1))
};

function initTable() {
    const tbody = document.getElementById('channel-table');
    for (let i = 0; i < NUM_CH; i++) {
        const tr = document.createElement('tr');
        const opts = Array.from({length: NUM_CH}, (_, j) =>
            `<option value="${j}" id="mapopt-${i}-${j}">A${j+1}</option>`
        ).join('');
        tr.innerHTML = `
            <td class="col-nr" style="color:#64748b;font-size:0.8rem">E${i+1}</td>
            <td class="col-iname" id="iname-label-${i}">Eingang ${i+1}</td>
            <td class="col-st"><span class="led led-off" id="in-${i}"></span></td>
            <td class="col-map">
                <select id="map-${i}" onchange="setMapping(${i}, this.value)">
                    <option value="-1">-- keine --</option>
                    ${opts}
                </select>
            </td>
            <td class="col-rel"><span class="led led-off" id="out-${i}"></span></td>
            <td class="col-timer">
                <input type="text" class="timer-input" id="timer-${i}" value="00:00:00"
                       placeholder="hh:mm:ss"
                       onfocus="this.select()"
                       onkeydown="timerKey(event,${i})"
                       onchange="setTimer(${i}, hmsToSecs(this.value))">
                <div class="remaining" id="remaining-${i}">Rest: --</div>
            </td>
            <td class="col-btn"><button onclick="toggleRelay(${i})">Toggle</button></td>
        `;
        tbody.appendChild(tr);
    }
}

function updateDropdownLabels() {
    for (let i = 0; i < NUM_CH; i++) {
        for (let j = 0; j < NUM_CH; j++) {
            const opt = document.getElementById(`mapopt-${i}-${j}`);
            if (opt) opt.textContent = `A${j+1}: ${state.names[j]}`;
        }
    }
}

function secsToHMS(secs) {
    if (!secs || secs <= 0) return '00:00:00';
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function hmsToSecs(str) {
    str = str.trim().toLowerCase();
    if (/\d[hms]/.test(str)) {
        const h = (str.match(/(\d+)\s*h/) || [0,0])[1];
        const m = (str.match(/(\d+)\s*m/) || [0,0])[1];
        const s = (str.match(/(\d+)\s*s/) || [0,0])[1];
        return Math.min(+h*3600 + +m*60 + +s, 604800);
    }
    if (str.includes(':')) {
        const parts = str.split(':').map(v => parseInt(v) || 0);
        if (parts.length >= 3) return Math.min(parts[0]*3600 + parts[1]*60 + parts[2], 604800);
        return Math.min(parts[0]*60 + (parts[1]||0), 604800);
    }
    return Math.min(parseInt(str) || 0, 604800);
}

function timerKey(e, i) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const input = document.getElementById(`timer-${i}`);
    let secs = hmsToSecs(input.value) + (e.key === 'ArrowUp' ? 600 : -600);
    secs = Math.max(0, Math.min(secs, 604800));
    input.value = secsToHMS(secs);
    setTimer(i, secs);
}

function tickCountdown() {
    let changed = false;
    for (let i = 0; i < NUM_CH; i++) {
        if (state.outputs[i] && state.remaining[i] > 0) {
            state.remaining[i] -= 1;
            changed = true;
        }
    }
    if (changed) updateUI();
}

function updateUI() {
    for (let i = 0; i < NUM_CH; i++) {
        document.getElementById(`in-${i}`).className =
            state.inputs[i] ? 'led led-input-on' : 'led led-off';
        document.getElementById(`out-${i}`).className =
            state.outputs[i] ? 'led led-on' : 'led led-off';
        document.getElementById(`map-${i}`).value = state.mappings[i];
        document.getElementById(`iname-label-${i}`).textContent = state.input_names[i];

        const timerInput = document.getElementById(`timer-${i}`);
        if (document.activeElement !== timerInput)
            timerInput.value = secsToHMS(state.timers[i]);

        const rem = document.getElementById(`remaining-${i}`);
        rem.textContent = (state.outputs[i] && state.remaining[i] > 0)
            ? `Rest: ${secsToHMS(state.remaining[i])}` : 'Rest: --';
    }
}

function applyState(data) {
    if (data.inputs)      state.inputs      = data.inputs;
    if (data.outputs)     state.outputs     = data.outputs;
    if (data.mappings)    state.mappings    = data.mappings;
    if (data.timers)      state.timers      = data.timers;
    if (data.remaining)   state.remaining   = data.remaining;
    if (data.names)       { state.names       = data.names;       updateDropdownLabels(); }
    if (data.input_names) state.input_names = data.input_names;
}

function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => {
        document.getElementById('connection-status').textContent = 'Verbunden';
        document.getElementById('connection-status').className = 'connected';
    };
    ws.onclose = () => {
        document.getElementById('connection-status').textContent = 'Verbindung getrennt – Neuverbindung...';
        document.getElementById('connection-status').className = 'disconnected';
        setTimeout(connectWS, 2000);
    };
    ws.onmessage = (evt) => { try { applyState(JSON.parse(evt.data)); updateUI(); } catch(e) { console.warn('WS parse error', e); } };
}

function toggleRelay(ch) { wsSend({cmd:'toggle', ch}); }
function setMapping(input, output) { wsSend({cmd:'map', input, output: parseInt(output)}); }
function setTimer(ch, secs) { wsSend({cmd:'timer', ch, secs: parseInt(secs)}); }

fetch('/api/state').then(r => r.json()).then(data => { applyState(data); updateUI(); }).catch(e => console.warn('fetch /api/state failed', e));

initTable();
updateUI();
setInterval(tickCountdown, 1000);
connectWS();
</script>
</body>
</html>

; PlatformIO Configuration for IO-Hutschienenboard
; ESP32-S3-WROOM-1 (DUBEUYEW), 16MB Flash, 8MB PSRAM

[env:esp32s3]
; Version FEST pinnen! Ohne Pin zieht PlatformIO espressif32 55.x (Arduino-Core 3.x),
; damit bricht der Build an zwei Stellen:
;   - Freenove WS2812 1.x nutzt die entfernte RMT-API (rmtSetTick/rmt_send)
;   - dhcp_search_ip_on_mac() in main.cpp hat in IDF 5.x einen zusaetzlichen
;     ersten Parameter (dhcps_t*); Ersatz waere esp_netif_dhcps_get_clients_by_mac()
; 6.12.0 ist der Stand, mit dem die laufende Firmware gebaut wurde.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino

; Flash and memory configuration matching the DUBEUYEW board (16MB Flash, 8MB PSRAM)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

; PSRAM enable
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1

; Serial monitor (COM port = CH343 UART)
monitor_speed = 115200
monitor_port = COM10
monitor_raw = yes

; LittleFS for serving web pages from flash
board_build.filesystem = littlefs

; Upload via COM port (CH343)
upload_speed = 921600

; Versionsnummer vor jedem Upload automatisch hochzählen
extra_scripts = pre:scripts/bump_version.py

; Libraries - use explicit owner to avoid conflicts
lib_deps =
    mathieucarbou/ESP Async WebServer @ ^3.0.6
    bblanchon/ArduinoJson @ ^7.4.2
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    freenove/Freenove WS2812 Lib for ESP32 @ ^1.0.6
    ayushsharma82/ElegantOTA @ ^3.1.7

; Exclude incompatible library
lib_ignore = AsyncTCP_RP2040W, ESPAsyncTCP-esphome, ESPAsyncWebServer

; OTA-Upload via WLAN (ArduinoOTA)
; OTA-Passwort wird aus ota_pass.txt gelesen (gitignored, Fallback: "admin").
; Nach Passwortänderung in der Web-UI: ota_pass.txt auf dem Entwicklungsrechner aktualisieren.
[env:esp32s3-ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = 192.168.0.79
extra_scripts =
    pre:scripts/bump_version.py
    pre:scripts/read_ota_pass.py
